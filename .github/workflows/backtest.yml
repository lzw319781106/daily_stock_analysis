name: Offline backtest

on:
  push:
    paths: ['src/backtest/**', 'src/stock_analyzer.py', 'src/storage.py', 'src/config.py', 'tests/backtest/**', '.github/workflows/backtest.yml']
  pull_request:
    paths: ['src/backtest/**', 'src/stock_analyzer.py', 'src/storage.py', 'src/config.py', 'tests/backtest/**', '.github/workflows/backtest.yml']

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline research dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.6 SQLAlchemy==2.0.43 python-dotenv==1.1.1
      - name: Test causality and accounting without API keys
        run: python -m unittest discover -s tests/backtest -v
      - name: Generate reproducible synthetic example
        run: python -m src.backtest --demo --output reports/backtest-demo
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-backtest-demo
          path: reports/backtest-demo
